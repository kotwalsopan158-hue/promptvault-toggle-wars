name: promptvault-lab
x-flagsmith: &flagsmith
  image: flagsmith/flagsmith:2.295.2
  environment:
    DATABASE_URL: postgresql://postgres:${PROMPTVAULT_DB_PASSWORD}@postgres:5432/flagsmith
    DJANGO_SECRET_KEY: ${PROMPTVAULT_DJANGO_KEY}
    WAREHOUSE_CREDENTIALS_SECRET: ${PROMPTVAULT_WAREHOUSE_KEY}
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    FLAGSMITH_DOMAIN: localhost:8000
    API_URL: http://localhost:8000/api/v1/
    ENVIRONMENT: production
    EXPERIMENTATION_ENABLED: "true"
    USE_POSTGRES_FOR_ANALYTICS: "true"
    TASK_RUN_METHOD: SYNCHRONOUSLY
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_PASSWORD: ${PROMPTVAULT_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flagsmith"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *flagsmith
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  flagsmith:
    <<: *flagsmith
    command: ["serve"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  data:
