name: Flagsmith warehouse verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'src/experiment.js'
      - 'src/runtime.js'
      - 'src/receipts.js'
      - '.github/workflows/flagsmith-lab.yml'
permissions:
  contents: read
jobs:
  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Start an isolated local Flagsmith experiment
        run: |
          node lab/start.mjs --prepare
          cat .promptvault-lab/browser.env >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify browser events in the PostgreSQL warehouse
        run: node lab/verify.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: synthetic-flagsmith-evidence
          path: lab-output/
