name: Verify PromptVault
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Save production build and dependency lock
        uses: actions/upload-artifact@v5
        with:
          name: promptvault-build
          path: |
            dist/
            package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:demo
      - run: node scripts/check-portable.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: promptvault-complete-project
          path: release/
