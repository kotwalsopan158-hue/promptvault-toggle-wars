name: Verify PromptVault
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Save production build and dependency lock
        uses: actions/upload-artifact@v5
        with:
          name: promptvault-build
          path: |
            dist/
            package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:demo
      - run: node scripts/check-portable.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: promptvault-complete-project
          path: release/

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release PromptVault v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: promptvault-complete-project
          path: release
      - name: Publish the verified app and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" release/PromptVault.html release/PromptVault-full-source.md release/PromptVault-source.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PromptVault $tag" \
            --notes "Open PromptVault.html to try the app. The ZIP contains the full project, Flagsmith Cloud setup, measured synthetic results, and the two-minute demo script. The Markdown download contains every tracked file in full."
