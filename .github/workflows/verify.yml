name: Verify PromptVault
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install exact dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Record the dependency lock from the first clean install
        run: node -e "console.log('PROMPTVAULT_LOCK '+require('node:zlib').gzipSync(require('node:fs').readFileSync('package-lock.json')).toString('base64'))"
      - run: npm test
      - run: npm run build
      - name: Save production build and dependency lock
        uses: actions/upload-artifact@v5
        with:
          name: promptvault-build
          path: |
            dist/
            package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
